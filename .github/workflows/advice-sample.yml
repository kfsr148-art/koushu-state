# 助言の見本（2026-11-26・橋の枠 三百四十②・本人の決め）。
#   ＊公開の版（koushu-handan の ver.txt）が上がるたび、雲で無作為の配牌100局×人格と方言をばらして、本体が実際に出す助言の文を作り、
#     この repo の senko/advice-sample.md に版つきで書く（センコが先に読んで変な文を見つける）。VAIO では回さない。
#   ＊起こし方（枠 三百五十五で替えた）：主に VAIO の beats-check.js が、公開の版と見本の版の食い違いが2分続いたら直に起こす。控えとして 7・22・37・52 分に ver.txt を見て、senko/advice-sample.md の「版：」と同じなら何もしない（早く終わる）。手で起こすなら force=true。
#   ＊作る道具は koushu-handan の tools/advice-sample.js（本体は読むだけ・写しに probe を差し込んで headless Chrome で駆動）。
#   ＊鍵 HANDAN_PUSH_TOKEN は koushu-handan を読むためだけに使う（公開の所へ書かない）。
name: 助言の見本
on:
  schedule:
    - cron: '7,22,37,52 * * * *'   # 枠 三百五十五：控え。00・15・30・45 は混むので分をずらした。主な起こし方は VAIO の beats-check.js が公開の版の食い違いで直に起こす
  workflow_dispatch:
    inputs:
      force:
        description: '版が同じでも作り直す（true）'
        required: false
        default: 'false'
permissions:
  contents: write
  actions: write
concurrency:
  group: advice-sample
  cancel-in-progress: false
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: koushu-handan を取得する（読むだけ）
        uses: actions/checkout@v4
        with:
          repository: kfsr148-art/koushu-handan
          path: handan
          fetch-depth: 1
          token: ${{ secrets.HANDAN_PUSH_TOKEN }}
      - name: 版を比べる
        id: ver
        run: |
          now=$(tr -dc '0-9' < handan/ver.txt)
          have=$(sed -n 's/^版：//p' senko/advice-sample.md 2>/dev/null | head -1 | tr -dc '0-9')
          echo "公開の版 ${now}／見本の版 ${have:-無し}"
          if [ "$now" = "$have" ] && [ "${{ github.event.inputs.force }}" != "true" ]; then echo "need=no" >> "$GITHUB_OUTPUT"; else echo "need=yes" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.ver.outputs.need == 'yes'
        with:
          node-version: '20'
      - name: 日本語の字体を入れる（絵の字が豆腐にならないように）
        if: steps.ver.outputs.need == 'yes'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f
      - name: 判定カードの絵（決まった30局・横向き844x390）と枠の検査
        if: steps.ver.outputs.need == 'yes'
        run: node handan/tools/advice-shots.js handan senko
      - name: 見本を作る（100局）
        if: steps.ver.outputs.need == 'yes'
        run: |
          now=$(tr -dc '0-9' < handan/ver.txt)
          prev=$(ls senko/advice-sample/*-fixed.json 2>/dev/null | grep -v "/${now}-fixed" | sort -V | tail -1)
          echo "前の版の固定30局：${prev:-無し}"
          node handan/tools/advice-sample.js handan senko 100 ${prev:+--prev $prev}
          # 絵は新しい5版まで
          ls -d senko/advice-shots/*/ 2>/dev/null | sort -V | head -n -5 | xargs -r rm -rf
          # 版ごとの残しは新しい20版まで（古い物から消す）
          ls senko/advice-sample/*-fixed.json 2>/dev/null | sort -V | head -n -20 | while read f; do v=$(basename "$f" -fixed.json); rm -f "senko/advice-sample/$v.md" "senko/advice-sample/$v-fixed.json" "senko/advice-sample/$v-vaio-snap.md"; done
      - name: 押して配信を起こす
        if: steps.ver.outputs.need == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "advice-sample-bot"
          git config user.email "advice-sample-bot@users.noreply.github.com"
          git add -A senko/advice-sample.md senko/advice-diff.md senko/advice-sample senko/advice-shots
          git diff --cached --quiet && { echo "変わりなし"; exit 0; }
          git commit -m "senko/advice-sample.md：助言の見本（版 $(tr -dc '0-9' < handan/ver.txt)・100局）"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; done
          gh workflow run deploy.yml || true
      - name: 脈を書く（最後に動いた刻・見本を作った時か前から45分たっていれば）
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NEED: ${{ steps.ver.outputs.need }}
        run: |
          git config user.name "advice-sample-bot"
          git config user.email "advice-sample-bot@users.noreply.github.com"
          git pull --rebase -q origin main || true
          node -e '
            const fs = require("fs"); const f = "senko/beats.json"; let b = {};
            try { b = JSON.parse(fs.readFileSync(f, "utf8")); } catch (e) { }
            const now = Math.floor(Date.now() / 1000), prev = (b["advice-cron"] || {}).at || 0, made = process.env.NEED === "yes";
            if (!made && now - prev < 45 * 60) { process.exit(0); }
            b["advice-cron"] = { label: "助言の見本の雲の決まった時刻の仕事", at: now, every: 0, grace: 0 };   /* 枠 三百五十五：時刻でなく版の食い違い（advice-sync）で見るので、ここは見込みを持たない（パネルは赤くしない） */
            if (made) { b["advice-sample"] = { label: "助言の見本を作った最後（版ごと）", at: now, every: 0, grace: 0 }; }
            const keys = Object.keys(b).sort();
            fs.mkdirSync("senko", { recursive: true });
            fs.writeFileSync(f, "{\n" + keys.map(k => JSON.stringify(k) + ": " + JSON.stringify(b[k])).join(",\n") + "\n}\n");
          '
          git add senko/beats.json
          git diff --cached --quiet && { echo "脈は変わりなし"; exit 0; }
          git commit -m "senko/beats.json：助言の見本の脈"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; done
          gh workflow run deploy.yml || true
